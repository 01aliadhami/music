<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Music</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: sans-serif;
    }

    .player {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      text-align: center;
      width: 300px;
      color: white;
    }

    .player h2 {
      margin: 0 0 15px;
      font-size: 18px;
      font-weight: 500;
      opacity: 0.9;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 12px;
    }

    .note {
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="player">
    <h2>🎵 Now Playing</h2>
    <audio autoplay controls>
      <source src="music.m4a" type="audio/mpeg">
      مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
    </audio>
    <div class="note">Scan & Enjoy ✨</div>
  </div>

</body>
</html>
