<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Music</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: sans-serif;
    }

    .player {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      text-align: center;
      width: 300px;
      color: white;
    }

    h2 { margin-bottom: 15px; }

    button {
      background: #1db954;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      color: black;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="player">
    <h2>🎵 Play Music</h2>
    <button onclick="play()">▶ Play</button>
    <audio id="audio">
      <source src="music.mp3" type="audio/mp3">
    </audio>
  </div>

  <script>
    function play() {
      document.getElementById('audio').play();
    }
  </script>

</body>
</html>
